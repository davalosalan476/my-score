<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日分数累积">
<title>每日分数累积</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b82ff'/%3E%3Cstop offset='1' stop-color='%237b60ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='37' font-family='sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3E%E5%88%86%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1d2230; --muted:#8b92a6; --line:#ebedf4;
  --accent:#4b78ff; --accent-soft:#eaf0ff;
  --green:#17a06a; --green-soft:#e6f7ef;
  --red:#e0575b; --red-soft:#fdecec;
  --shadow:0 1px 2px rgba(24,32,64,.04), 0 8px 20px rgba(24,32,64,.05);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.topbar{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.88);backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid rgba(24,32,64,.05);padding-top:env(safe-area-inset-top)}
.topbar-in{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:560px;margin:0 auto}
.brand-name{font-weight:700;font-size:17px;letter-spacing:.2px}
.brand-sub{font-size:12px;color:var(--muted);margin-top:1px}
.grow{flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#59607a;
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}

.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin:12px 0}
.card-title{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;
  color:#4a5068;margin-bottom:10px}
.link{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  padding:8px 6px;margin:-8px -4px;display:inline-flex;align-items:center;min-height:35px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 8px;line-height:1.7}

.field{display:block;margin:10px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;
  font-size:16px;color:var(--ink);font-family:inherit;outline:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:#c8d6ff;background:#fff}
textarea{min-height:90px;resize:vertical;font-size:14px;line-height:1.5}
.two{display:flex;gap:10px}
.two>*{flex:1}

.btn{width:100%;border:0;border-radius:13px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;
  cursor:pointer;margin-top:10px;transition:transform .06s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(75,120,255,.28)}
.btn-soft{background:var(--accent-soft);color:#3558c9}
.btn-green{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(23,160,106,.24)}
.btn-ghost{background:transparent;color:var(--muted);border:1px dashed var(--line);box-shadow:none}
.btn-danger{background:var(--red-soft);color:#b4343a}
.btn:disabled{opacity:.5;box-shadow:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fbfcfe;color:#4a5068;border-radius:11px;padding:8px 12px;
  font-size:14px;cursor:pointer;font-family:inherit}
.chip:active{background:var(--accent-soft)}
.chip.on{background:var(--accent-soft);border-color:#c8d6ff;color:#3558c9;font-weight:600}
.chip .r{color:var(--muted);font-size:12px;margin-left:5px}

.rollbox{margin-top:12px;background:linear-gradient(180deg,#f7f9ff,#eef3ff);border:1px solid #e2e9ff;
  border-radius:14px;padding:14px;text-align:center}
.roll-num{font-size:44px;font-weight:800;letter-spacing:-1px;color:#3458c9;line-height:1.1}
.roll-num.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.roll-hint{font-size:13px;color:var(--muted);margin-top:4px}

.seg{display:flex;background:#e9ecf5;border-radius:12px;padding:3px;margin:12px 0;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-size:14px;
  color:#5b627a;font-family:inherit;cursor:pointer;font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(24,32,64,.1)}

.period{display:flex;align-items:center;gap:8px;padding:4px}
.period-label{flex:1;text-align:center;font-weight:600;font-size:15px}
.nav-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;
  color:#59607a;font-size:16px;cursor:pointer;flex:none}

.stats3{display:flex;gap:10px;text-align:center}
.stats3>div{flex:1;background:#fafbfe;border:1px solid var(--line);border-radius:13px;padding:10px 6px}
.stats3 .k{font-size:12px;color:var(--muted)}
.stats3 .v{font-size:19px;font-weight:700;margin-top:2px}
.v-green{color:var(--green)} .v-red{color:var(--red)} .v-accent{color:#3458c9}

.row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row.tap:active{background:#fafbff}
.badge{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700}
.b-in{background:var(--green-soft);color:var(--green)}
.b-out{background:var(--red-soft);color:var(--red)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-v{font-weight:700;font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:7px;background:#f1f3f9;color:#6d748c;margin-left:6px}

.reward{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.reward:last-child{border-bottom:0}
.redeem-btn{flex:none;border:0;border-radius:11px;padding:9px 14px;font-weight:700;font-size:13px;font-family:inherit;
  background:var(--green-soft);color:#0f7a4f;cursor:pointer}
.redeem-btn:disabled{background:#f1f2f6;color:#a9aebf;cursor:not-allowed}

.hero{background:linear-gradient(135deg,#5b82ff,#7b60ff);color:#fff;border-radius:18px;padding:18px;
  box-shadow:0 10px 24px rgba(85,110,255,.25)}
.hero .lbl{font-size:13px;opacity:.86}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:13px;opacity:.9;margin-top:6px}

.chart{display:flex;align-items:flex-end;gap:4px;height:132px;padding-top:8px}
.cgroup{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cbars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.cbar{width:46%;border-radius:4px 4px 0 0;min-height:2px}
.cbar.in{background:linear-gradient(180deg,#4fd39b,#17a06a)}
.cbar.out{background:linear-gradient(180deg,#f79093,#e0575b)}
.cx{font-size:10px;color:var(--muted);text-align:center;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:1px}

.catbar{margin:9px 0}
.catbar-t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.track{height:9px;background:#eef0f6;border-radius:6px;overflow:hidden}
.track>i{display:block;height:100%;border-radius:6px}
.streak{display:flex;align-items:center;gap:12px}
.streak .fire{font-size:28px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-top:1px solid rgba(24,32,64,.06);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:560px;margin:0 auto}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 7px;font-family:inherit;font-size:10.5px;color:#9aa0b4;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:19px;line-height:1.15;filter:grayscale(1) opacity(.55)}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar button.on .ic{filter:none}

.backdrop{position:fixed;inset:0;background:rgba(20,26,45,.38);z-index:60;display:flex;align-items:flex-end;
  opacity:0;transition:opacity .18s}
.backdrop.show{opacity:1}
.sheet{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
  transform:translateY(18px);transition:transform .2s}
.backdrop.show .sheet{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:#e2e5ef;margin:6px auto 10px}
.sheet-title{font-weight:700;font-size:17px;margin-bottom:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(112px + env(safe-area-inset-bottom));
  background:rgba(29,34,48,.94);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;z-index:80;
  opacity:0;transition:.2s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.note{background:#fffaf0;border:1px solid #ffe9c9;color:#8a6520;font-size:12.5px;border-radius:12px;padding:10px 12px;line-height:1.6}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="grow">
      <div class="brand-name" id="brandName">每日分数累积</div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="设置">⚙</button>
  </div>
</header>

<main class="wrap">

  <!-- ===== 记一笔 ===== -->
  <section class="view" id="v-add">
    <div class="card">
      <div class="card-title"><span>常用事务（点一下自动填好）</span><button class="link" data-act="presets">管理</button></div>
      <div class="chips" id="presetChips"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>记一笔得分</span></div>
      <label class="field"><span>事务名称</span><input id="f-name" placeholder="例如：跑步、整理房间"></label>
      <div class="two">
        <label class="field"><span>最低分</span><input id="f-min" type="number" step="any" inputmode="decimal" placeholder="30"></label>
        <label class="field"><span>最高分</span><input id="f-max" type="number" step="any" inputmode="decimal" placeholder="50"></label>
      </div>
      <div class="card-title" style="margin:6px 0 8px"><span>分类（可不选）</span><button class="link" data-act="cats">管理分类</button></div>
      <div class="chips" id="f-cats"></div>
      <button class="btn btn-soft" data-act="roll">🎲 抽取随机分</button>
      <div class="rollbox hidden" id="rollBox">
        <div class="roll-num" id="rollNum">0</div>
        <div class="roll-hint" id="rollHint"></div>
      </div>
      <label class="field"><span>本次得分（可手动改）</span>
        <input id="f-score" type="number" step="any" inputmode="decimal" placeholder="抽取后自动填入"></label>
      <label class="field"><span>时间（默认现在，可改成过去）</span>
        <input id="f-time" type="datetime-local"></label>
      <label class="field"><span>备注（可选）</span><input id="f-note" placeholder="记一句今天的情况"></label>
      <button class="btn btn-primary" data-act="save-task">保存这一笔</button>
      <button class="btn btn-ghost" data-act="save-preset">把这条存为常用事务</button>
    </div>
  </section>

  <!-- ===== 待办 ===== -->
  <section class="view hidden" id="v-todo">
    <div class="card">
      <div class="card-title"><span>常用事务（点一下直接加入待办）</span></div>
      <div class="chips" id="todoPresetChips"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>添加待办</span></div>
      <label class="field"><span>名称</span><input id="td-name" placeholder="今天打算做什么"></label>
      <div class="two">
        <label class="field"><span>最低分</span><input id="td-min" type="number" step="any" inputmode="decimal" placeholder="30"></label>
        <label class="field"><span>最高分</span><input id="td-max" type="number" step="any" inputmode="decimal" placeholder="50"></label>
      </div>
      <div class="card-title" style="margin:6px 0 8px"><span>分类（可不选）</span></div>
      <div class="chips" id="td-cats"></div>
      <button class="btn btn-soft" data-act="add-todo">加入待办</button>
    </div>
    <div class="card">
      <div class="card-title"><span>待完成</span><span class="muted small" id="todoCount"></span></div>
      <div id="todoList"></div>
    </div>
    <div class="note">待办里的分数区间是"做完能拿多少分"的预期。点「完成」才会现场抽随机分并计入记录。</div>
  </section>

  <!-- ===== 记录 ===== -->
  <section class="view hidden" id="v-log">
    <div class="seg" id="logSeg">
      <button data-unit="all">全部</button>
      <button data-unit="day">日</button>
      <button data-unit="week">周</button>
      <button data-unit="month">月</button>
      <button data-unit="year">年</button>
    </div>
    <div class="card hidden" id="logPeriodCard">
      <div class="period">
        <button class="nav-btn" data-act="log-prev">‹</button>
        <div class="period-label" id="logPeriodLabel"></div>
        <button class="nav-btn" data-act="log-next">›</button>
      </div>
    </div>
    <div class="card"><div class="stats3" id="logSummary"></div></div>
    <div class="card"><div id="logList"></div></div>
  </section>

  <!-- ===== 奖励 ===== -->
  <section class="view hidden" id="v-rewards">
    <div class="hero">
      <div class="lbl">当前可花的积分</div>
      <div class="big" id="rwBalance">0</div>
      <div class="sub" id="rwSub"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>奖励清单</span><button class="link" data-act="add-reward">+ 添加奖励</button></div>
      <div id="rewardList"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>兑换记录</span></div>
      <div id="redeemList"></div>
    </div>
    <div class="note">兑换会立刻从余额里扣掉。想反悔就去「记录」里点开那条兑换，选「撤销兑换」。</div>
  </section>

  <!-- ===== 总览 ===== -->
  <section class="view hidden" id="v-stats">
    <div class="card">
      <div class="streak">
        <div class="fire" id="streakFire">🔥</div>
        <div class="grow">
          <div style="font-weight:700;font-size:17px" id="streakMain">连续 0 天</div>
          <div class="small muted" id="streakSub"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stats3">
        <div><div class="k">累计得分</div><div class="v v-green" id="stEarn">0</div></div>
        <div><div class="k">累计花费</div><div class="v v-red" id="stSpend">0</div></div>
        <div><div class="k">当前余额</div><div class="v v-accent" id="stBal">0</div></div>
      </div>
      <div class="small muted center" style="margin-top:10px" id="stMeta"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>得分 / 花费走势</span><span class="muted small" id="chartRange"></span></div>
      <div class="chart" id="chart"></div>
      <div class="legend">
        <span><i class="dot" style="background:#17a06a"></i>得分</span>
        <span><i class="dot" style="background:#e0575b"></i>花费</span>
      </div>
      <div class="seg" id="statSeg" style="margin-top:12px">
        <button data-unit="day">按日</button>
        <button data-unit="week">按周</button>
        <button data-unit="month">按月</button>
        <button data-unit="year">按年</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span>分类统计</span></div>
      <div id="catStats"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>做得最多的事务</span></div>
      <div id="topTasks"></div>
    </div>
    <div class="card">
      <div class="card-title"><span>现在能兑换</span></div>
      <div id="affordable"></div>
    </div>
    <div class="card">
      <div class="note" id="backupNote"></div>
      <button class="btn btn-soft" data-act="export-copy">复制备份内容</button>
    </div>
  </section>

</main>

<nav class="tabbar">
  <div class="tabbar-in">
    <button data-tab="add" class="on"><span class="ic">✏️</span>记一笔</button>
    <button data-tab="todo"><span class="ic">✅</span>待办</button>
    <button data-tab="log"><span class="ic">📒</span>记录</button>
    <button data-tab="rewards"><span class="ic">🎁</span>奖励</button>
    <button data-tab="stats"><span class="ic">📊</span>总览</button>
  </div>
</nav>

<div class="toast" id="toast"></div>
<div class="backdrop hidden" id="backdrop">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
"use strict";
/* ==================== 基础工具 ==================== */
var KEY = "points-ledger-v1";
var DAY = 86400000;
var PALETTE = ["#4b78ff","#17a06a","#ef9f2b","#e0575b","#8b5cf6","#0ea5e9","#ec4899","#14b8a6"];

function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function fmt(n){ var x = Math.round(num(n)*100)/100; return String(x); }
function pad2(n){ return (n<10?"0":"")+n; }
function toLocalInput(ts){
  var d = new Date(ts);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function nowInput(){ return toLocalInput(Date.now()); }
function fmtTime(ts){
  var d = new Date(ts), w = "日一二三四五六"[d.getDay()];
  return (d.getMonth()+1)+"月"+d.getDate()+"日 周"+w+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}

/* ==================== 数据 ==================== */
function blankRaw(){
  return {
    version: 2,
    settings: { appName:"每日分数累积", unit:"分", weekStart:1, lastExport:0, lastCatId:"" },
    categories: [
      { id: uid(), name: "运动" }, { id: uid(), name: "学习" },
      { id: uid(), name: "家务" }, { id: uid(), name: "生活" }
    ],
    presets: [], todos: [], tasks: [], rewards: [], redemptions: []
  };
}
function firstRun(){
  var b = blankRaw();
  b.presets = [
    { id: uid(), name: "跑步", min: 30, max: 50, categoryId: b.categories[0].id },

    { id: uid(), name: "看一集剧", cost: 50 },
    { id: uid(), name: "买杯奶茶", cost: 150 }
  ];

}
function normalize(d){
  var b = blankRaw();
  var out = {
    version: 2,
    settings: Object.assign(b.settings, d.settings || {}),
    categories: Array.isArray(d.categories) && d.categories.length ? d.categories : b.categories,
    presets: Array.isArray(d.presets) ? d.presets : [],
    todos: Array.isArray(d.todos) ? d.todos : [],
    tasks: Array.isArray(d.tasks) ? d.tasks : [],
    rewards: Array.isArray(d.rewards) ? d.rewards : [],
    redemptions: Array.isArray(d.redemptions) ? d.redemptions : []
  };
  if(!out.settings.unit) out.settings.unit = "分";
  if(!out.settings.appName) out.settings.appName = "每日分数累积";
  return out;
}
function load(){

function totalSpend(){ return S.redemptions.reduce(function(a,r){ return a + num(r.cost); }, 0); }
function balance(){ return totalEarn() - totalSpend(); }

function catById(id){

}
function catName(id){ var c = catById(id); return c ? c.name : ""; }
function catColor(id){
  var i = -1;
  for(var k=0;k<S.categories.length;k++){ if(S.categories[k].id === id){ i = k; break; } }
  return i < 0 ? "#8b92a6" : PALETTE[i % PALETTE.length];
}
function catTag(id){

}
function rangeText(t){
  if(t && t.min != null && t.max != null) return fmt(t.min)+"~"+fmt(t.max);
  return "";
}

/* ==================== 日期区间 ==================== */
function startOf(d, unit){
  var x = new Date(d); x.setHours(0,0,0,0);
  if(unit === "day") return x;
  if(unit === "week"){
    var ws = num(S.settings.weekStart);
    var diff = (x.getDay() - ws + 7) % 7;
    x.setDate(x.getDate() - diff);
    return x;
  }
  if(unit === "month"){ x.setDate(1); return x; }
  if(unit === "year"){ x.setMonth(0,1); return x; }
  return x;
}
function addPeriod(d, unit, n){
  var x = new Date(d);
  if(unit === "day") x.setDate(x.getDate() + n);
  else if(unit === "week") x.setDate(x.getDate() + 7*n);
  else if(unit === "month") x.setMonth(x.getMonth() + n, 1);
  else if(unit === "year") x.setFullYear(x.getFullYear() + n, 0, 1);
  return startOf(x, unit);
}
function periodLabel(d, unit){
  var s = startOf(d, unit);
  if(unit === "day"){
    var w = "日一二三四五六"[s.getDay()];
    return s.getFullYear()+"年"+(s.getMonth()+1)+"月"+s.getDate()+"日 · 周"+w;
  }
  if(unit === "week"){
    var e = new Date(addPeriod(s,"week",1)); e.setDate(e.getDate()-1);
    return (s.getMonth()+1)+"月"+s.getDate()+"日 – "+(e.getMonth()+1)+"月"+e.getDate()+"日";
  }
  if(unit === "month") return s.getFullYear()+"年"+(s.getMonth()+1)+"月";
  return s.getFullYear()+"年";
}
function inRange(ts, s, e){ return ts >= s.getTime() && ts < e.getTime(); }
function streak(){
  var days = {};
  S.tasks.forEach(function(t){ days[startOf(t.ts,"day").getTime()] = true; });
  var today = startOf(Date.now(), "day");
  var todayDone = !!days[today.getTime()];
  var cur = 0, cursor = todayDone ? today : addPeriod(today, "day", -1);
  while(days[cursor.getTime()]){ cur++; cursor = addPeriod(cursor, "day", -1); }
  var keys = Object.keys(days).map(Number).sort(function(a,b){ return a-b; });
  var longest = 0, run = 0, prev = null;
  keys.forEach(function(k){
    run = (prev !== null && k - prev === DAY) ? run + 1 : 1;
    if(run > longest) longest = run;
    prev = k;
  });
  return { current: cur, longest: longest, todayDone: todayDone, activeDays: keys.length };
}

function pickPreset(id){

  document.getElementById("f-name").value = p.name;

  renderPresets();
  doRoll();

function rollInRange(mn, mx){
  if(mx < mn){ var t = mn; mn = mx; mx = t; }
  var r = Math.random()*(mx-mn) + mn;
  return (Number.isInteger(mn) && Number.isInteger(mx)) ? Math.round(r) : Math.round(r*10)/10;
}
function doRoll(){
  var mn = document.getElementById("f-min").value, mx = document.getElementById("f-max").value;
  if(mn === "" || mx === ""){ toast("先填一个分数区间，比如 30 到 50"); return null; }
  var min = num(mn), max = num(mx);
  if(max < min){ var t = min; min = max; max = t; }
  var score = rollInRange(min, max);
  ui.lastRoll = score;
  var box = document.getElementById("rollBox");
  box.classList.remove("hidden");
  var n = document.getElementById("rollNum");
  n.textContent = "+" + fmt(score);
  n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop");
  document.getElementById("rollHint").textContent = "在 " + fmt(min) + " ~ " + fmt(max) + " 之间随机取得 · 不满意可以再抽";
  document.getElementById("f-score").value = fmt(score);
  return score;
}

/* ==================== 渲染：记录 ==================== */
function recordsIn(s, e){
  var out = [];
  S.tasks.forEach(function(t){
    if(inRange(t.ts, s, e)) out.push({ kind:"in", ts:t.ts, id:t.id, name:t.name, v:num(t.score), note:t.note, categoryId:t.categoryId });
  });
  S.redemptions.forEach(function(r){
    if(inRange(r.ts, s, e)) out.push({ kind:"out", ts:r.ts, id:r.id, name:r.name, v:num(r.cost), note:r.note });
  });
  return out.sort(function(a,b){ return b.ts - a.ts; });
}
function renderLog(){
  var unit = ui.logUnit;
  Array.prototype.forEach.call(document.querySelectorAll("#logSeg button"), function(b){
    b.classList.toggle("on", b.dataset.unit === unit);
  });
  var pc = document.getElementById("logPeriodCard"), rows;
  if(unit === "all"){
    pc.classList.add("hidden");
    rows = recordsIn(new Date(0), new Date(8640000000000000));
  }else{
    pc.classList.remove("hidden");
    var s = startOf(ui.logAnchor, unit), e = addPeriod(s, unit, 1);
    document.getElementById("logPeriodLabel").textContent = periodLabel(s, unit);
    rows = recordsIn(s, e);
  }
  var earn = 0, spend = 0;
  rows.forEach(function(r){ if(r.kind === "in") earn += r.v; else spend += r.v; });
  document.getElementById("logSummary").innerHTML =
    '<div><div class="k">得分</div><div class="v v-green">+'+fmt(earn)+'</div></div>'+
    '<div><div class="k">花费</div><div class="v v-red">-'+fmt(spend)+'</div></div>'+
    '<div><div class="k">净得</div><div class="v v-accent">'+(earn-spend >= 0 ? "+" : "")+fmt(earn-spend)+'</div></div>';
  var list = document.getElementById("logList");
  if(!rows.length){ list.innerHTML = '<div class="empty">这个范围里还没有记录。</div>'; return; }
  var shown = rows.slice(0, 200);
  list.innerHTML = shown.map(function(r){
    var sub = fmtTime(r.ts) + (r.note ? " · " + esc(r.note) : "");
    var badge = r.kind === "in"
      ? catBadge({ categoryId: r.categoryId })
      : '<div class="badge b-out">🎁</div>';
    return '<div class="row tap" data-act="edit-'+(r.kind === "in" ? "task" : "redeem")+'" data-id="'+r.id+'">'+

  }).join("") + (rows.length > 200
    ? '<div class="empty">只显示最近 200 条，本范围共 '+rows.length+' 条</div>' : "");
}

  save(); renderAll();
  toast("兑换成功：" + r.name + " · 扣 " + fmt(num(r.cost)) + "，" + unitName() + "余额 " + fmt(balance()));
}

/* ==================== 渲染：总览 ==================== */
function bucketCount(unit){ return unit === "day" ? 14 : unit === "week" ? 12 : unit === "month" ? 12 : 5; }
function bucketLabel(d, unit){
  if(unit === "month") return (d.getMonth()+1)+"月";
  if(unit === "year") return d.getFullYear()+"年";
  return (d.getMonth()+1)+"/"+d.getDate();
}
function renderStats(){
  var st = streak();
  document.getElementById("streakMain").textContent = "已连续 " + st.current + " 天";
  document.getElementById("streakFire").textContent = st.current >= 3 ? "🔥" : "✨";
  var parts = ["最长连续 " + st.longest + " 天", "共记录过 " + st.activeDays + " 天"];
  parts.push(st.todayDone ? "今天已记录 ✓" : "今天还没记录，去做一件小事吧");
  document.getElementById("streakSub").textContent = parts.join(" · ");

  var earn = totalEarn(), spend = totalSpend(), bal = balance();
  document.getElementById("stEarn").textContent = "+" + fmt(earn);
  document.getElementById("stSpend").textContent = "-" + fmt(spend);
  document.getElementById("stBal").textContent = fmt(bal);
  document.getElementById("stMeta").textContent =
    S.tasks.length + " 笔得分 · " + S.redemptions.length + " 次兑换 · " +
    (st.activeDays && earn ? "平均每天 " + fmt(Math.round(earn/st.activeDays*10)/10) + " " + unitName() : "还没有得分记录");

  Array.prototype.forEach.call(document.querySelectorAll("#statSeg button"), function(b){
    b.classList.toggle("on", b.dataset.unit === ui.statUnit);
  });
  var unit = ui.statUnit, n = bucketCount(unit);
  var cur = startOf(Date.now(), unit), buckets = [], data = [];
  for(var i = n-1; i >= 0; i--){
    var bs = addPeriod(cur, unit, -i), be = addPeriod(bs, unit, 1);
    buckets.push({ s: bs });
    var rows = recordsIn(bs, be), a = 0, c = 0;
    rows.forEach(function(r){ if(r.kind === "in") a += r.v; else c += r.v; });
    data.push({ a: a, c: c });
  }
  var max = 1;
  data.forEach(function(d){ max = Math.max(max, d.a, d.c); });
  document.getElementById("chart").innerHTML = data.map(function(d, i){
    var ah = Math.round(d.a/max*100), ch = Math.round(d.c/max*100);
    return '<div class="cgroup" title="'+bucketLabel(buckets[i].s, unit)+' 得分 '+fmt(d.a)+' 花费 '+fmt(d.c)+'">'+
      '<div class="cbars">'+
        '<div class="cbar in" style="height:'+(d.a ? Math.max(ah,3) : 0)+'%"></div>'+
        '<div class="cbar out" style="height:'+(d.c ? Math.max(ch,3) : 0)+'%"></div>'+
      '</div><div class="cx">'+bucketLabel(buckets[i].s, unit)+'</div></div>';
  }).join("");
  document.getElementById("chartRange").textContent = n + " 个" +
    (unit === "day" ? "天" : unit === "week" ? "周" : unit === "month" ? "月" : "年");

  // 分类统计
  var agg = {}, tot = 0;
  S.tasks.forEach(function(t){
    var k = t.categoryId || "__none";
    if(!agg[k]) agg[k] = { score:0, count:0 };
    agg[k].score += num(t.score); agg[k].count++;
    tot += num(t.score);
  });
  var catKeys = Object.keys(agg).sort(function(a,b){ return agg[b].score - agg[a].score; });
  document.getElementById("catStats").innerHTML = catKeys.length ? catKeys.map(function(k){
    var d = agg[k], pct = tot ? Math.round(d.score/tot*100) : 0;
    var name = k === "__none" ? "未分类" : (catName(k) || "已删除的分类");
    var color = k === "__none" ? "#b6bccd" : catColor(k);
    return '<div class="catbar"><div class="catbar-t"><span>'+esc(name)+'</span>'+
      '<span class="muted">+'+fmt(d.score)+' · '+d.count+' 次 · '+pct+'%</span></div>'+
      '<div class="track"><i style="width:'+Math.max(pct,2)+'%;background:'+color+'"></i></div></div>';
  }).join("") : '<div class="empty">还没有数据。</div>';

  // Top 事务
  var aggT = {};
  S.tasks.forEach(function(t){
    if(!aggT[t.name]) aggT[t.name] = { name:t.name, score:0, count:0 };
    aggT[t.name].score += num(t.score); aggT[t.name].count++;
  });
  var tops = Object.keys(aggT).map(function(k){ return aggT[k]; })
    .sort(function(a,b){ return b.score - a.score; }).slice(0,5);
  document.getElementById("topTasks").innerHTML = tops.length ? tops.map(function(t){
    return '<div class="reward"><div class="row-main"><div class="row-t">'+esc(t.name)+'</div>'+
      '<div class="row-s">'+t.count+' 次 · 平均 '+fmt(Math.round(t.score/t.count*10)/10)+'</div></div>'+
      '<div class="row-v v-green">+'+fmt(t.score)+'</div></div>';
  }).join("") : '<div class="empty">还没有数据。</div>';

  // 现在能兑换
  var can = S.rewards.filter(function(r){ return bal >= num(r.cost); })
    .sort(function(a,b){ return num(b.cost) - num(a.cost); });
  document.getElementById("affordable").innerHTML = can.length ? can.map(function(r){
    return '<div class="reward"><div class="row-main"><div class="row-t">'+esc(r.name)+'</div>'+
      '<div class="row-s">需要 '+fmt(r.cost)+' '+esc(unitName())+'</div></div>'+
      '<button class="redeem-btn" data-act="redeem" data-id="'+r.id+'">兑换</button></div>';
  }).join("") : '<div class="empty">暂时没有兑换得起的奖励。<br>再攒一攒，或者加个便宜点的小奖励。</div>';

  var last = num(S.settings.lastExport);
  var ds = last ? Math.floor((Date.now()-last)/DAY) : null;
  document.getElementById("backupNote").innerHTML =
    "数据只保存在这台手机的浏览器里，不会自动同步到别处。" +
    (ds === null ? "建议现在做一次备份。" :
      ds >= 30 ? "上次备份是 " + ds + " 天前，建议再做一次。" :
      "上次备份：" + ds + " 天前，记得定期备份。");
}

/* ==================== 图标 / 添加到桌面 ==================== */
function drawIcon(size, bleed){
  var c = document.createElement("canvas");
  c.width = c.height = size;
  var g = c.getContext("2d");
  var grad = g.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, "#5b82ff");
  grad.addColorStop(1, "#7b60ff");
  g.fillStyle = grad;
  if(bleed){ g.fillRect(0, 0, size, size); }
  else{
    var r = size*0.22;
    g.beginPath();
    g.moveTo(r, 0); g.lineTo(size-r, 0); g.quadraticCurveTo(size, 0, size, r);
    g.lineTo(size, size-r); g.quadraticCurveTo(size, size, size-r, size);
    g.lineTo(r, size); g.quadraticCurveTo(0, size, 0, size-r);
    g.lineTo(0, r); g.quadraticCurveTo(0, 0, r, 0);
    g.closePath(); g.fill();
  }
  g.fillStyle = "#fff";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "700 " + Math.round(size*0.46) + "px 'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText("分", size/2, size*0.54);
  return c.toDataURL("image/png");
}
function setupIcons(){
  try{
    // 先清掉旧的，避免改过名字后留下过期的图标配置
    [].forEach.call(document.querySelectorAll('link[rel="manifest"],link[rel="apple-touch-icon"]'), function(n){ n.remove(); });
    var i192 = drawIcon(192, false), i512 = drawIcon(512, false), iMask = drawIcon(512, true);
    var link = document.createElement("link");
    link.rel = "apple-touch-icon"; link.href = i192;
    document.head.appendChild(link);
    var man = {
      name: S.settings.appName, short_name: String(S.settings.appName).slice(0, 6),
      start_url: location.href.split("#")[0], scope: location.href.split("#")[0],
      display: "standalone", orientation: "portrait",
      background_color: "#f4f6fb", theme_color: "#f4f6fb",
      icons: [
        { src: i192, sizes:"192x192", type:"image/png" },
        { src: i512, sizes:"512x512", type:"image/png" },
        { src: iMask, sizes:"512x512", type:"image/png", purpose:"maskable" }
      ]
    };
    var ml = document.createElement("link");
    ml.rel = "manifest";
    ml.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(ml);
  }catch(e){}
}

      var td0 = S.todos.filter(function(x){ return x.id === id; })[0];
      if(td0){
        todosDone.roll = rollInRange(num(td0.min), num(td0.max));
        $("tdRoll").textContent = "+" + fmt(todosDone.roll);
        animateRollNum();
      }
      break;
    case "confirm-todo": confirmTodo(id); break;
    case "edit-todo": editTodo(id); break;
    case "todo-set-cat":
      var td1 = S.todos.filter(function(x){ return x.id === id; })[0];
      if(td1){ td1.categoryId = el.dataset.id === "" ? "" : el.dataset.id; }
      var idStore = id; editTodo(idStore);
      break;
    case "save-todo-edit":
      var td2 = S.todos.filter(function(x){ return x.id === id; })[0];
      if(td2){
        td2.name = val("e-tdname").trim() || td2.name;
        td2.min = num(val("e-tdmin")); td2.max = num(val("e-tdmax"));
      }
      save(); closeSheet(); renderTodo(); renderHead(); toast("已保存");
      break;
    case "del-todo":
      S.todos = S.todos.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); renderTodo(); renderHead(); toast("已删除");
      break;

    case "edit-preset": editPreset(id); break;
    case "preset-set-cat":
      el.classList.add("on");
      tmpCat.forPreset = el.dataset.cat;
      Array.prototype.forEach.call(document.querySelectorAll("#e-pcats .chip"), function(b){ b.classList.remove("on"); });
      el.classList.add("on");
      break;
    case "save-preset-edit":
      if(!val("e-pname").trim()){ toast("填个名称"); break; }
      if(id){
        var p = S.presets.filter(function(x){ return x.id === id; })[0];
        if(p){ p.name = val("e-pname").trim(); p.min = num(val("e-pmin")); p.max = num(val("e-pmax")); p.categoryId = tmpCat.forPreset || ""; }
      }else{
        S.presets.push({ id: uid(), name: val("e-pname").trim(), min: num(val("e-pmin")), max: num(val("e-pmax")), categoryId: tmpCat.forPreset || "" });
      }
      tmpCat.forPreset = "";
      save(); renderPresets(); closeSheet(); toast("已保存");
      break;
    case "del-preset":
      S.presets = S.presets.filter(function(x){ return x.id !== id; });
      save(); renderPresets(); closeSheet(); toast("已删除");
      break;
    case "edit-cat": editCat(id); break;
    case "save-cat":
      if(!val("e-cname").trim()){ toast("填个分类名"); break; }
      if(id){
        var cc = S.categories.filter(function(x){ return x.id === id; })[0];
        if(cc) cc.name = val("e-cname").trim();
      }else S.categories.push({ id: uid(), name: val("e-cname").trim() });
      save(); closeSheet(); renderAll(); toast("已保存");
      break;
    case "del-cat":
      S.categories = S.categories.filter(function(x){ return x.id !== id; });
      S.presets.forEach(function(p){ if(p.categoryId === id) p.categoryId = ""; });
      S.todos.forEach(function(t){ if(t.categoryId === id) t.categoryId = ""; });
      S.tasks.forEach(function(t){ if(t.categoryId === id) t.categoryId = ""; });
      if(ui.pickCat === id) ui.pickCat = "";
      if(ui.todoPickCat === id) ui.todoPickCat = "";
      save(); closeSheet(); renderAll(); toast("已删除");
      break;

    case "edit-task": editTask(id); break;
    case "task-set-cat":
      tmpCat.forTask = el.dataset.cat;
      Array.prototype.forEach.call(document.querySelectorAll("#e-cats .chip"), function(b){ b.classList.remove("on"); });
      el.classList.add("on");
      break;
    case "save-task-edit":
      var t = S.tasks.filter(function(x){ return x.id === id; })[0];
      if(t){
        t.name = val("e-name").trim() || t.name;
        t.min = val("e-min") === "" ? null : num(val("e-min"));
        t.max = val("e-max") === "" ? null : num(val("e-max"));
        t.score = num(val("e-score"));
        var tv = val("e-time"); if(tv) t.ts = new Date(tv).getTime();
        t.note = val("e-note").trim();
        if(tmpCat.forTask !== undefined) t.categoryId = tmpCat.forTask;
      }
      tmpCat.forTask = undefined;
      save(); closeSheet(); renderAll(); toast("已保存");
      break;
    case "re-roll":
      var t2 = S.tasks.filter(function(x){ return x.id === id; })[0];
      if(t2){
        var mn = t2.min, mx = t2.max;
        if(mn == null || mx == null){ toast("这条没有区间，先在上面填最低/最高分"); break; }
        var sc = rollInRange(num(mn), num(mx));
        $("e-score").value = fmt(sc);
        toast("重抽到 " + fmt(sc) + "，点「保存修改」生效");
      }
      break;
    case "del-task":
      if(!confirm("删除这笔得分记录？")) break;
      S.tasks = S.tasks.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); renderAll(); toast("已删除");
      break;
    case "edit-redeem": editRedeem(id); break;
    case "save-redeem-edit":
      var rr = S.redemptions.filter(function(x){ return x.id === id; })[0];
      if(rr){ var tv2 = val("e-time"); if(tv2) rr.ts = new Date(tv2).getTime(); }
      save(); closeSheet(); renderAll(); toast("已保存");
      break;
    case "undo-redeem":
      if(!confirm("撤销这次兑换并退回积分？")) break;
      S.redemptions = S.redemptions.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); renderAll(); toast("已撤销，积分退回来了");
      break;
    case "add-reward": editReward(""); break;
    case "edit-reward": editReward(id); break;
    case "save-reward":
      if(!val("e-rname").trim()){ toast("给奖励取个名字"); break; }
      if(id){
        var rw = S.rewards.filter(function(x){ return x.id === id; })[0];
        if(rw){ rw.name = val("e-rname").trim(); rw.cost = num(val("e-rcost")); }
      }else S.rewards.push({ id: uid(), name: val("e-rname").trim(), cost: num(val("e-rcost")) });
      save(); closeSheet(); renderAll(); toast("已保存");
      break;
    case "del-reward":
      if(!confirm("删除这个奖励？（已兑换的记录会保留）")) break;
      S.rewards = S.rewards.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); renderAll(); toast("已删除");
      break;
    case "redeem": redeem(id); break;
    case "log-prev": ui.logAnchor = addPeriod(startOf(ui.logAnchor, ui.logUnit), ui.logUnit, -1).getTime(); renderLog(); break;
    case "log-next":
      var nx = addPeriod(startOf(ui.logAnchor, ui.logUnit), ui.logUnit, 1).getTime();
      if(nx <= Date.now()){ ui.logAnchor = nx; renderLog(); }
      break;
    case "settings": settingsSheet(); break;
    case "save-settings":
      S.settings.appName = val("s-name").trim() || "每日分数累积";
      S.settings.unit = val("s-unit").trim() || "分";
      var on = document.querySelector("#weekSeg button.on");
      if(on) S.settings.weekStart = num(on.dataset.ws);
      save(); closeSheet(); renderAll(); setupIcons(); toast("设置已保存");
      break;
    case "export-copy": exportCopy(); break;
    case "export-file": exportFile(); break;
    case "import-text":
      var txt = val("s-import");
      if(!txt.trim()){ toast("先粘贴备份内容"); break; }
      applyImport(txt);
      break;
    case "wipe":
      if(!confirm("清空全部数据？这会删掉所有得分、待办、奖励和兑换记录，无法撤销。")) break;
      if(!confirm("再确认一次：真的要清空吗？")) break;
      S = firstRun(); save(); closeSheet(); renderAll(); toast("已清空");
      break;
    case "close-sheet": closeSheet(); break;
  }
});

/* ==================== 启动 ==================== */
document.getElementById("f-time").value = nowInput();
setupIcons();
renderAll();
goTab("add");
</script>
</body>
</html>
